# The packages the HTML extractor runs with, and numpy, which the build and the repair of the weaves run with (the decision
# docs/decisions/2026-11-13-the-engine-may-use-numpy.md), pinned by version and by the sha256 of the wheel file.
#
#   python3 -m venv engine/.venv
#   engine/.venv/bin/python -m pip install --require-hashes --no-deps -r engine/requirements.lock
#
# The three packages the plan names are trafilatura, beautifulsoup4 and lxml; the rest are what pip resolved for them.
# Provenance: resolved on 2026-11-05 with Python 3.15.0 and pip 26.2.2 on macOS arm64; each hash is the sha256 of the
# wheel file downloaded from PyPI with `pip download --no-deps --only-binary=:all:` for exactly this version. Only the
# wheel for this platform is hashed, so on another platform or Python the install is refused until the lock is rebuilt.
# numpy was added on 2026-11-13 (numpy-2.5.4-cp315-cp315-macosx_14_0_arm64.whl, 5454250 bytes, Python 3.15.0, pip 26.2.2). `pip download`
# served the wheel from pip's cache of an earlier install from PyPI, so its hash was also compared with the sha256 that PyPI publishes
# for that file (https://pypi.org/pypi/numpy/2.5.4/json): equal. numpy has no dependencies.
